# sahiy-agent (Go): Postgres + the API service and the Telegram bot.
#
#   docker compose up -d --build
#
# Schema migrations and the baseline FAQ seed are applied by the Go services
# themselves on startup - there is no separate migrate or seed step.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahiy-agent-db
    environment:
      POSTGRES_USER: sahiy
      POSTGRES_PASSWORD: ${SAHIY_DB_PASSWORD:-sahiy_test}
      POSTGRES_DB: sahiy_agent
    # Bound to loopback so the database is reachable for local development
    # (.env points DATABASE_URL at localhost:5433) without being exposed to the
    # network. The Go services reach it over the compose network instead.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sahiy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahiy -d sahiy_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  go-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sahiy-agent-api
    ports:
      - "8001:8001"
    env_file: .env
    # Inside the compose network reach Postgres by service name, not localhost.
    environment:
      DATABASE_URL: "postgres://sahiy:${SAHIY_DB_PASSWORD:-sahiy_test}@postgres:5432/sahiy_agent?sslmode=disable"
    command: ["sahiy-api"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  go-bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sahiy-agent-bot
    env_file: .env
    environment:
      DATABASE_URL: "postgres://sahiy:${SAHIY_DB_PASSWORD:-sahiy_test}@postgres:5432/sahiy_agent?sslmode=disable"
    command: ["sahiy-bot"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sahiy_pgdata:
